 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snackabot</title>

  <!-- SEO -->
  <meta name="description" content="Snackabot is a Providence, Rhode Island–based vending machine service operator providing automated food and drink services with a strong focus on quality, reliability, and modern automation. Serving Providence exclusively.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0054FF">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #FFE135;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Comfortaa, sans-serif;
      position: relative;
    }

    .nav {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 16px;
    }

    .nav a {
      color: #000;
      text-decoration: none;
      font-weight: 500;
      margin-left: 15px;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .branding {
      text-align: center;
    }

    .logo {
      font-size: 64px;
      font-weight: 500;
      margin: 0;
    }

    .motto {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>

  <div class="nav">
    <a href="getamachine.html">Get Snackabot!</a>
    <a href="aboutus.html">About us</a>
  </div>

  <div class="branding">
    <h1 class="logo">Snackabot</h1>
    <p class="motto">Reliable. Modern. Always stocked.</p>
  </div>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

  <!-- Shared Footer -->
  <div id="footer"></div>
  <script>
    fetch("footer.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("footer").innerHTML = html;
      });
  </script>

</body>
</html>
