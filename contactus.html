<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us | Snackabot</title>


    <!-- Favicon & PWA icons -->
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0054FF">

  <!-- Comfortaa -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #FFE135;
      color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Comfortaa, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .nav {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 16px;
    }

    .nav a {
      color: #000000;
      text-decoration: none;
      font-weight: 500;
    }

    .nav a:hover {
      text-decoration: underline;
    }

    .logo {
      font-size: 64px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .content {
      max-width: 700px;
      font-size: 16px;
      line-height: 1.6;
    }

    form {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      font-family: Comfortaa, sans-serif;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #000;
      border-radius: 4px;
    }

    button {
      background: #000;
      color: #FFE135;
      border: none;
      padding: 12px;
      font-family: Comfortaa, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Honeypot field – bots see it, humans don’t */
    .hp {
      display: none;
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="index.html">Home</a>
  </div>

  <div class="logo">Snackabot</div>

  <div class="content">
    <p>
      Snackabot is a vending machine business focused on reliable service,
      simple design, and modern automation.
    </p>

    <p>
      For sales or placement inquiries, use the form below.
    </p>

    <!-- BOT-SAFE FORM -->
    <form action="https://formspree.io/f/maqqnoen" method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Message" rows="4" required></textarea>

      <!-- Honeypot -->
      <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off">

      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
